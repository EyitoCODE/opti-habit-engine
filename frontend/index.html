<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opti-Habit Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Opti-Habit Engine</h1>
            <p class="subtitle">CV-Verified Mathematical Momentum Tracking</p>
        </header>

        <section class="card new-habit-card">
            <h2>Register Habit</h2>
            <form id="habit-form">
                <div class="form-group">
                    <label for="habit-title">Habit Name</label>
                    <input type="text" id="habit-title" placeholder="Optical Sensor Calibration" required>
                </div>
                <div class="form-group">
                    <label for="habit-weight">Difficulty Weight (W)</label>
                    <input type="number" id="habit-weight" step="0.1" min="0.1" max="10.0" value="1.0" required>
                </div>
                <button type="submit" class="btn primary-btn">Add Habit</button>
            </form>
        </section>

        <section class="card">
            <h2>Active Habit Momentum</h2>
            <div id="habits-list" class="habits-grid">
                <p class="loading">Querying active habits...</p>
            </div>
        </section>
    </div>

    <div id="status-toast" class="toast hidden"></div>
    <script src="app.js"></script>
</body>
</html>
